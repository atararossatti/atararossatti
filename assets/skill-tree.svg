<title id="t">Árvore de habilidades</title>
<desc id="d">Roadmap em três colunas: desbloqueado (JavaScript, HTML e CSS, PHP e Node.js, SQL, APIs, QA, Linux e cloud, Figma), em treino (Python, Jupyter, LLMs, Hugging Face, APIs de modelos, automação com IA) e próximo nível (fundamentos de ML, preparação de dados, treino e avaliação, RAG, IA em aplicações). Meta final: AI Engineer.</desc>
<defs>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1.8" fill="#7FB9C6" opacity=".16"/></pattern>
<style>

.chip{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.dim{}
.march{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-30}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
.chev{animation:chev 1.2s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.2}50%{opacity:1}}
.boss{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #F7C948)}50%{filter:drop-shadow(0 0 12px #F7C948)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1.1) rotate(45deg);opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
