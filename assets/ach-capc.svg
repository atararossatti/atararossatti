</g>
<g transform="translate(104 20)"><path class="tw" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#F7C948"/></g>
<text class="tag" x="122" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="11" letter-spacing="2.2" fill="#E0524A">CONQUISTA DESBLOQUEADA</text>
